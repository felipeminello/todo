AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ToDo Bomber - anexos das tarefas. Bucket S3 privado, Lambda que emite URLs
  pre-assinadas e API HTTP que so aceita o ID token do Firebase.

Parameters:
  FirebaseProjectId:
    Type: String
    Default: todo-bomber
    Description: Projeto Firebase cujos ID tokens a API aceita.
  MaxBytes:
    Type: Number
    Default: 26214400
    Description: Tamanho maximo de um anexo, em bytes (25 MB).
  MaxPerTask:
    Type: Number
    Default: 20
    Description: Quantidade maxima de anexos por tarefa.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    # Os anexos sao dados dos usuarios: apagar a stack nao apaga o bucket.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub todo-bomber-attachments-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SomenteHTTPS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub ${Bucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: todo-bomber-attachments-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: attachments
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${Bucket.Arn}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${LogGroup.Arn}:*

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/todo-bomber-attachments
      RetentionInDays: 30

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: todo-bomber-attachments
      Description: Emite URLs pre-assinadas dos anexos das tarefas do ToDo Bomber.
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: handler.handler
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref Bucket
          FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
          MAX_BYTES: !Ref MaxBytes
          MAX_PER_TASK: !Ref MaxPerTask
      # O codigo de verdade esta em lambda/handler.py e e publicado a parte
      # (ver README.md); a stack so cria a funcao.
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 503, "body": '{"error":"not_deployed"}'}

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: todo-bomber-attachments
      Description: Anexos das tarefas do ToDo Bomber.
      ProtocolType: HTTP

  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: firebase
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Issuer: !Sub https://securetoken.google.com/${FirebaseProjectId}
        Audience:
          - !Ref FirebaseProjectId

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"

  ListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /tasks/{taskId}/attachments
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      Target: !Sub integrations/${Integration}

  UploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /tasks/{taskId}/attachments
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      Target: !Sub integrations/${Integration}

  DeleteAllRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: DELETE /tasks/{taskId}/attachments
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      Target: !Sub integrations/${Integration}

  DownloadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /tasks/{taskId}/attachments/{attachmentId}
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      Target: !Sub integrations/${Integration}

  DeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: DELETE /tasks/{taskId}/attachments/{attachmentId}
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      Target: !Sub integrations/${Integration}

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

Outputs:
  ApiUrl:
    Description: URL base da API, usada em lib/app/attachments_api_config.dart.
    Value: !GetAtt Api.ApiEndpoint
  BucketName:
    Value: !Ref Bucket
